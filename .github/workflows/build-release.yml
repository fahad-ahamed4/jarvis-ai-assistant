name: Build Release (archer.exe + archer.apk)

# Auto-builds the Windows desktop app (Electron) and the Android app
# (Capacitor) and attaches them to a GitHub Release.
# Triggered by: pushing a tag (v1.0.0 …) or manually from the Actions tab.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows — archer.exe
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & build Electron app
        working-directory: electron
        run: |
          npm install --no-audit --no-fund
          npm run dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-windows
          path: |
            electron/dist/archer.exe
            electron/dist/archer-setup-*.exe
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            electron/dist/archer.exe
            electron/dist/archer-setup-*.exe
          generate_release_notes: true

  build-android:
    name: Android — archer.apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install Capacitor tooling
        run: |
          npm install --no-audit --no-fund
          npx cap sync android

      - name: Build signed release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/archer-release.apk out/archer.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android
          path: out/archer.apk
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/archer.apk
